name: ci

on:
  push:
    branches: [main, v0]
  pull_request:

jobs:
  # ─── Job 1: lint + typecheck + unit tests ──────────────────────────────────
  # @allod/core is a prebuilt tarball from Allod's GitHub releases, so no
  # Rust toolchain or allod checkout is needed here.
  lint-typecheck-unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Lint (biome)
        run: pnpm lint

      - name: Typecheck (tsc --build)
        run: pnpm typecheck

      - name: Unit tests (excludes e2e and kill)
        run: |
          pnpm --filter @freehold/api test:unit
          pnpm --filter '!@freehold/api' -r test

  # ─── Job 2: API e2e (with allod verify cross-check) ────────────────────────
  # The Rust allod CLI is built from source here because the cross-check is
  # the point: an independent implementation verifies the graph freehold wrote.
  e2e-allod-verify:
    name: E2E + allod verify cross-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout freehold
        uses: actions/checkout@v4
        with:
          path: freehold

      - name: Checkout allod (main)
        uses: actions/checkout@v4
        with:
          repository: yourbuddyconner/allod
          ref: main
          path: allod

      - uses: dtolnay/rust-toolchain@stable

      - name: Build allod Rust binary (for allod verify cross-check)
        working-directory: allod
        run: cargo build -p allod --release

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: freehold/pnpm-lock.yaml

      - name: Install freehold dependencies
        working-directory: freehold
        run: pnpm install --frozen-lockfile

      - name: Build packages
        working-directory: freehold
        run: pnpm -r build

      - name: Run API e2e tests (includes pi-agent E2E + kill test)
        working-directory: freehold
        run: pnpm --filter @freehold/api test

      - name: allod verify cross-check
        # Run `allod verify` against the graph written by the test suite.
        # The CLI test suite writes to a temp FREEHOLD_HOME with graph/main.
        # We create a fresh graph via the API, write some nodes, then verify
        # with the Rust allod CLI.
        working-directory: freehold
        env:
          ALLOD_BIN: ${{ github.workspace }}/allod/target/release/allod
        run: |
          # Boot Freehold on a temp home, write data, verify with the allod CLI
          export FREEHOLD_HOME=$(mktemp -d)
          export PORT=18710
          export TOKEN=ci-verify-token

          # Write config
          echo "{\"token\":\"$TOKEN\",\"port\":$PORT,\"graph\":\"main\",\"embedder\":\"hash\",\"defaultAgent\":\"ci-agent\"}" \
            > "$FREEHOLD_HOME/config.json"

          # Start Freehold in the background
          pnpm --filter @freehold/api exec tsx src/cli/index.ts serve &
          DAEMON_PID=$!

          # Wait for it to be ready
          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:$PORT/health" && break
            sleep 1
          done

          # Register the CI agent before it writes
          curl -sf -X POST "http://127.0.0.1:$PORT/api/v1/agents" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"name":"ci-agent"}' > /dev/null

          # Write some knowledge via the API
          curl -sf -X POST "http://127.0.0.1:$PORT/api/v1/remember" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"content":"CI cross-check node","agent":"ci-agent"}' > /dev/null

          curl -sf -X POST "http://127.0.0.1:$PORT/api/v1/remember" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"content":"Second CI node for verify test","agent":"ci-agent"}' > /dev/null

          # Verify the graph is structurally valid (freehold verify endpoint)
          VERIFY=$(curl -sf "http://127.0.0.1:$PORT/api/v1/verify" \
            -H "Authorization: Bearer $TOKEN")
          echo "freehold verify: $VERIFY"
          echo "$VERIFY" | grep -q '"ok":true'

          # Stop Freehold
          kill $DAEMON_PID 2>/dev/null || true

          # Run allod verify on the graph directory
          GRAPH_DIR="$FREEHOLD_HOME/graphs/main"
          if [ ! -d "$GRAPH_DIR" ]; then
            echo "ERROR: graph directory missing after writes — admission may be broken"
            exit 1
          fi
          "$ALLOD_BIN" verify "$GRAPH_DIR"
          echo "allod verify: OK"

          # Cleanup
          rm -rf "$FREEHOLD_HOME"

  # ─── Job 3: binary build + kill test ───────────────────────────────────────
  binary-build-kill-test:
    name: Binary build + kill test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Build binary (bun compile + sidecar copy)
        run: node packages/api/build/compile-binary.mjs
        env:
          BUN: bun

      - name: Smoke test binary
        run: |
          export FREEHOLD_HOME=$(mktemp -d)
          export PORT=28710
          export TOKEN=ci-binary-token

          echo "{\"token\":\"$TOKEN\",\"port\":$PORT,\"graph\":\"main\",\"embedder\":\"hash\",\"defaultAgent\":\"ci-agent\"}" \
            > "$FREEHOLD_HOME/config.json"

          ./packages/api/dist/freehold serve &
          BINARY_PID=$!

          for i in $(seq 1 30); do
            curl -sf "http://127.0.0.1:$PORT/health" && break
            sleep 1
          done

          curl -sf "http://127.0.0.1:$PORT/health" | grep -q '"status":"ok"'
          echo "Binary health check: OK"

          kill $BINARY_PID 2>/dev/null || true
          rm -rf "$FREEHOLD_HOME"

      - name: Kill test (SIGKILL recovery against compiled binary)
        env:
          FREEHOLD_BINARY: ${{ github.workspace }}/packages/api/dist/freehold
        run: pnpm --filter @freehold/api test -- tests/kill.test.ts
